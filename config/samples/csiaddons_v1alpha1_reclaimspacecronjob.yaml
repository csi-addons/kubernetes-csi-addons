---
apiVersion: csiaddons.openshift.io/v1alpha1
kind: ReclaimSpaceCronJob
metadata:
  name: reclaimspacecronjob-sample
spec:
  schedule: "@weekly"
  jobTemplate:
    spec:
      target:
        persistentVolumeClaim: data-pvc
      # Defaults to ["Node"]; list "Controller" as well to additionally run
      # the controller-side reclaim.
      operations:
        - Controller
        - Node
