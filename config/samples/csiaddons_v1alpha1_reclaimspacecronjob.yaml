---
apiVersion: csiaddons.openshift.io/v1alpha1
kind: ReclaimSpaceCronJob
metadata:
  name: reclaimspacecronjob-sample
spec:
  schedule: "@weekly"
  jobTemplate:
    spec:
      target:
        persistentVolumeClaim: data-pvc
      # Defaults to ["Node"]. "Controller" is opt-in, as the controller-side
      # reclaim can be costly or unsafe on in-use volumes for some drivers.
      operations:
        - Node
