---
# yamllint disable rule:comments-indentation
apiVersion: csiaddons.openshift.io/v1alpha1
kind: ReclaimSpaceJob
metadata:
  name: reclaimspacejob-sample
spec:
  target:
    persistentVolumeClaim: data-pvc
  # operations selects which reclaim space operations to perform on the
  # volume. Valid values are "Controller" and "Node", at least one must be
  # specified. Defaults to ["Node"] when the field is omitted. "Controller"
  # is opt-in, as it can be costly or unsafe on in-use volumes for some
  # drivers.
  operations:
    - Node
  backOffLimit: 6
  retryDeadlineSeconds: 600
