---
name: Checkout and setup Docker Buildx
description: Checks out the repository and sets up QEMU and Docker Buildx for multi-arch builds

runs:
  using: composite
  steps:
    - name: Check out the repo
      uses: actions/checkout@v7.0.1

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
